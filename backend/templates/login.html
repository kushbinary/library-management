{% extends 'base.html' %}

{% block title %}Admin Login - Library Management{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                <i class="bi bi-shield-lock-fill display-5 d-block mb-2"></i>
                <h4 class="mb-0 fw-bold">Admin Login</h4>
                <p class="small text-white-50 mb-0">Library Management Cloud Portal</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">
                            <i class="bi bi-person-fill text-primary"></i> Username
                        </label>
                        <input type="text" class="form-control form-control-lg rounded-3" id="username" name="username" placeholder="Enter username" required autofocus>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-key-fill text-primary"></i> Password
                        </label>
                        <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold py-2 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3 rounded-bottom-4 border-0">
                <small class="text-muted">
                    Don't have an account? <a href="{{ url_for('signup') }}" class="fw-bold text-primary text-decoration-none">Register New Library</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
