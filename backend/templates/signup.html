{% extends 'base.html' %}

{% block title %}Sign Up - Register Library Account{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                <i class="bi bi-person-plus-fill display-5 d-block mb-2"></i>
                <h4 class="mb-0 fw-bold">Create Library Account</h4>
                <p class="small text-white-50 mb-0">Register your library and manage students securely</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/signup">
                    <div class="mb-3">
                        <label for="library_name" class="form-label fw-semibold">
                            <i class="bi bi-building text-primary"></i> Library / Business Name
                        </label>
                        <input type="text" class="form-control rounded-3" id="library_name" name="library_name" placeholder="e.g. Kush Study Hub" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">
                            <i class="bi bi-person-fill text-primary"></i> Username *
                        </label>
                        <input type="text" class="form-control rounded-3" id="username" name="username" placeholder="Choose a unique username" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">
                            <i class="bi bi-telephone-fill text-primary"></i> Mobile Number (WhatsApp)
                        </label>
                        <input type="tel" class="form-control rounded-3" id="phone" name="phone" placeholder="e.g. 9838127461">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-key-fill text-primary"></i> Password *
                        </label>
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Create a password" required>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold">
                            <i class="bi bi-shield-check text-primary"></i> Confirm Password *
                        </label>
                        <input type="password" class="form-control rounded-3" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold py-2 shadow-sm">
                        <i class="bi bi-person-check-fill me-1"></i> Register & Create Account
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3 rounded-bottom-4 border-0">
                <small class="text-muted">
                    Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">Sign In here</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
